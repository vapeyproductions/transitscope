services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /app/data
      APP_ENV: local
      OPS_PASSWORD: monitor
      OPS_CONTROL_TOKEN: monitor
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /app/data
      WORKER_MODE: live
      RUN_LIVE_PIPELINE: "false"
      AUTO_POPULATE_MANIFEST: "false"
      STAGE1_MANIFEST: /app/data/manifests/stage1-real-target-universe.jsonl
      WORKER_HEARTBEAT_SECONDS: 5
      LIVE_POLL_SECONDS: 300
      TARGET_UNIVERSE_SIZE: 126000
      STAGE1_BATCH_SIZE: 32
      STAGE1_MAX_WORKERS: 8
      STAGE1_POOL_SIZE: 500
      STAGE1_CONTINUOUS_INTAKE_PER_CYCLE: 2
      STAGE1_REFRESH_TARGETS: 8
      STAGE1_PROMOTION_THRESHOLD: 100
      STAGE2_REASSESSMENT_THRESHOLD: 100
      STAGE3_INITIAL_INTAKE_SIZE: 100
      STAGE3_REASSESSMENTS_PER_CYCLE: 4
      STAGE3_REASSESSMENT_CONCURRENCY: 4
      STAGE3_DISPATCHES_PER_CYCLE: 4
      HISTORY_EXPANSION_SECTORS: 4
      CATALOG_MAX_ROWS: 0
      CATALOG_AUDIT_BATCH_SIZE: 100
      TOP_N_DISPLAY: 500
      MAX_HISTORY_SECTORS: 8
      MAST_UNIVERSE_SECTORS: 1-26
      MAST_UNIVERSE_PER_SECTOR: 8000
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ""
      API_BACKEND_URL: http://api:8000
      OPS_PASSWORD: monitor
      OPS_CONTROL_TOKEN: monitor
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

