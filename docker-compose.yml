services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /app/data
      APP_ENV: local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /app/data
      WORKER_MODE: live
      STAGE1_MANIFEST: /app/data/manifests/stage1-real-target-universe.jsonl
      WORKER_HEARTBEAT_SECONDS: 5
      LIVE_POLL_SECONDS: 30
      TARGET_UNIVERSE_SIZE: 126000
      STAGE1_BATCH_SIZE: 2000
      STAGE1_MAX_WORKERS: 1
      STAGE1_POOL_SIZE: 2000
      STAGE2_CAPACITY: 100
      STAGE3_CAPACITY: 25
      TOP_N_DISPLAY: 500
      MAX_HISTORY_SECTORS: 8
    volumes:
      - ./data:/app/data

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

